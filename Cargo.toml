[workspace]
resolver = "2"
members = ["crates/*"]

# The one version of the whole repo: every crate inherits it and the web build
# reads it (web/vite.config.ts). Bump it here only; see README "Versions".
[workspace.package]
version = "0.2.0-dev"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false }
bytes = "1"
thiserror = { version = "2", default-features = false }
futures-core = "0.3"
wasm-bindgen = "0.2.129"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
clap = { version = "4", features = ["derive"] }
rust-embed = "8"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"

# wasm-pack builds crates/wasm with this profile; keep size down.
[profile.release.package.webrvizlite-wasm]
opt-level = "s"
